name: Credentials CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation (GLPI 12 / PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.6 is a required compatibility leg and runs the same CLI checks without continue-on-error.
        php-version: ['8.3', '8.4', '8.5', '8.6']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, intl, openssl, sodium
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: PHP CLI compatibility, syntax and regression tests
        run: bash tools/run-cli-tests.sh "${{ matrix.php-version }}"

      - name: JavaScript syntax
        run: |
          node --check public/js/credentials.js
          node --check public/js/credential-details.js
          node --check public/js/credential-frame.js

      - name: Destructive-action confirmation regression
        run: |
          node tests/js/confirmation_test.js
          node tests/js/detail_confirmation_test.js

      - name: GLPI iframe modal cancel regression
        run: |
          node tests/js/modal_frame_test.js
          node tests/js/modal_parent_message_test.js
          node tests/js/save_navigation_frame_test.js

      - name: Real iframe password reveal/copy/hide regression
        run: node tests/js/password_ui_test.js

      - name: GLPI tab refresh and live count regression
        run: node tests/js/tab_refresh_test.js

      - name: Validate XML and plugin package
        run: |
          php -r '$xml = new DOMDocument(); if (!$xml->load("credentials.xml", LIBXML_NONET)) { exit(1); }'
          php tools/validate-package.php

      - name: Verify PO and MO catalogs are synchronized
        run: python tools/compile_locales.py --check

      - name: Verify no generated English catalogs
        run: |
          ! find locales -maxdepth 1 -type f \( -name 'en_*.po' -o -name 'en_*.mo' \) | grep .

  code-quality:
    name: PHPCS and PHPStan (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP quality tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, iconv, intl, json, libxml, mbstring, mysqli, openssl, session, simplexml, tokenizer, zlib, zip, sodium
          coverage: none
          tools: cs2pr, phpcs:4.0.4
          fail-fast: true

      - name: Check out GLPI 12 core
        uses: actions/checkout@v4
        with:
          repository: glpi-project/glpi
          ref: 12.0.0
          path: .ci/glpi
          persist-credentials: false

      - name: Install GLPI 12 analysis dependencies
        run: composer install --working-dir=.ci/glpi --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Show analyzer versions
        run: |
          phpcs --version
          .ci/glpi/vendor/bin/phpstan --version

      - name: PHPCS (GLPI-compatible security and consistency rules)
        run: |
          set -o pipefail
          phpcs --standard=phpcs.xml.dist --report=checkstyle --no-cache | cs2pr

      - name: PHPStan static analysis
        run: .ci/glpi/vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --error-format=github --no-progress --memory-limit=1G

  package:
    name: Build installable test package
    needs: [static-validation, code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare plugin package
        id: metadata
        run: |
          VERSION=$(sed -n "s/.*PLUGIN_CREDENTIALS_VERSION', '\\([^']*\\)'.*/\\1/p" setup.php)
          if [ -z "$VERSION" ]; then
            echo "Could not read plugin version from setup.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/credentials
          cp -a front locales public src templates dist/credentials/
          cp credentials.xml setup.php hook.php logo.png LICENSE COPYRIGHT README.md CHANGELOG.md dist/credentials/
          (cd dist && zip -qr "../credentials-$VERSION.zip" credentials)
          sha256sum "credentials-$VERSION.zip" > "credentials-$VERSION.zip.sha256"

      - name: Upload installable test package
        uses: actions/upload-artifact@v4
        with:
          name: credentials-${{ steps.metadata.outputs.version }}-installable
          path: |
            credentials-${{ steps.metadata.outputs.version }}.zip
            credentials-${{ steps.metadata.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
