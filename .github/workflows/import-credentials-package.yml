name: One-time Credentials package import

on:
  push:
    branches:
      - sync/credentials-package-0.0.60
    paths:
      - __sync/part_*.b64

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4

      - name: Validate and overlay distributable package
        shell: bash
        run: |
          set -euo pipefail
          test -d __sync
          cat __sync/part_*.b64 | base64 --decode > __sync/credentials-0.0.60.zip
          unzip -t __sync/credentials-0.0.60.zip
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          unzip -q __sync/credentials-0.0.60.zip -d "$temp_dir"
          package="$temp_dir/credentials"
          test -f "$package/setup.php"
          test -f "$package/hook.php"
          test -f "$package/credentials.xml"
          test -d "$package/src"
          rsync -a "$package/" ./
          rm -rf __sync
          rm -f .github/workflows/import-credentials-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync: import Credentials 0.0.60 package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
