name: Import Credentials source

on:
  push:
    branches:
      - marketplace/0.0.27

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: marketplace/0.0.27
          persist-credentials: true

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode credentials-source-0.0.27.tar.xz.b64 > /tmp/credentials-source.tar.xz
          echo "784ad24a82d02bbbc035087dfb9caf6be4753a6a0e7c6f6c669d5e5fa857d44f  /tmp/credentials-source.tar.xz" | sha256sum --check
          mkdir -p /tmp/credentials-source
          tar -xJf /tmp/credentials-source.tar.xz -C /tmp/credentials-source
          test -f /tmp/credentials-source/credentials/credentials.xml
          test -f /tmp/credentials-source/credentials/tools/run-cli-tests.sh
          cp -a /tmp/credentials-source/credentials/. .
          rm -f credentials-source-0.0.27.tar.xz.b64 example.txt ci-bootstrap.txt .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: import complete Credentials 0.0.27 source tree"
          git push origin HEAD:marketplace/0.0.27
